<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="50%" stop-color="#dbeafe" />
      <stop offset="100%" stop-color="#bfdbfe" />
    </linearGradient>

    <!-- Book Cover Gradient -->
    <linearGradient id="coverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBC638" />
      <stop offset="55%" stop-color="#EBC638" />
      <stop offset="100%" stop-color="#EBC638" />
    </linearGradient>

    <!-- Spine Gradient -->
    <linearGradient id="spineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#1e40af" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Bookmark Ribbon Gradient -->
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Pen Body Gradient -->
    <linearGradient id="penGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="dropShadow" x="-15%" y="-15%" width="135%" height="135%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#1e3a8a" flood-opacity="0.28" />
    </filter>

    <filter id="penShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="-6" dy="14" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.32" />
    </filter>
  </defs>

  <!-- App Squircle Background -->
  <rect x="48" y="48" width="928" height="928" rx="210" fill="url(#bgGrad)" />
  <rect x="48" y="48" width="928" height="928" rx="210" fill="none" stroke="#93c5fd" stroke-width="8" opacity="0.6" />

  <!-- Diary Book Group -->
  <g filter="url(#dropShadow)">
    <!-- Back Cover & Pages Edge (Right / Bottom Offset) -->
    <rect x="250" y="176" width="548" height="692" rx="48" fill="#1e3a8a" />
    <rect x="242" y="164" width="544" height="688" rx="44" fill="#f8fafc" stroke="#cbd5e1" stroke-width="4" />
    <!-- Page Lines Effect on Right Edge -->
    <line x1="774" y1="190" x2="774" y2="826" stroke="#e2e8f0" stroke-width="4" />
    <line x1="764" y1="190" x2="764" y2="826" stroke="#cbd5e1" stroke-width="3" />

    <!-- Main Front Cover -->
    <rect x="220" y="148" width="544" height="688" rx="44" fill="url(#coverGrad)" />

    <!-- Book Spine (Left side) -->
    <path d="M 264 148 H 308 V 836 H 264 C 239.7 836 220 816.3 220 792 V 192 C 220 167.7 239.7 148 264 148 Z" fill="url(#spineGrad)" />
    <line x1="308" y1="148" x2="308" y2="836" stroke="#60a5fa" stroke-width="3" opacity="0.35" />

    <!-- Spiral / Stitched Binding Details on Spine -->
    <g fill="#93c5fd" opacity="0.55">
      <rect x="204" y="220" width="44" height="18" rx="9" />
      <rect x="204" y="330" width="44" height="18" rx="9" />
      <rect x="204" y="440" width="44" height="18" rx="9" />
      <rect x="204" y="550" width="44" height="18" rx="9" />
      <rect x="204" y="660" width="44" height="18" rx="9" />
      <rect x="204" y="750" width="44" height="18" rx="9" />
    </g>

    <!-- Elastic Strap / Clasp Band -->
    <rect x="688" y="148" width="32" height="688" fill="#1e3a8a" opacity="0.45" />

    <!-- White Label Card on Cover -->
    <rect x="356" y="236" width="288" height="330" rx="28" fill="#ffffff" />
    <rect x="372" y="252" width="256" height="298" rx="20" fill="none" stroke="#dbeafe" stroke-width="4" />

    <!-- Calendar / Checkmark Header Badge inside Label -->
    <circle cx="500" cy="322" r="42" fill="#eff6ff" />
    <path d="M 480 322 L 495 337 L 524 306" fill="none" stroke="#2563eb" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Diary Text Lines on Label Card -->
    <line x1="406" y1="402" x2="594" y2="402" stroke="#3b82f6" stroke-width="14" stroke-linecap="round" />
    <line x1="406" y1="448" x2="594" y2="448" stroke="#93c5fd" stroke-width="14" stroke-linecap="round" />
    <line x1="406" y1="494" x2="526" y2="494" stroke="#93c5fd" stroke-width="14" stroke-linecap="round" />

    <!-- Gold Bookmark Ribbon Hanging at Bottom -->
    <path d="M 380 836 V 918 L 416 890 L 452 918 V 836 Z" fill="url(#ribbonGrad)" />
  </g>

  <!-- Fountain / Stylus Pen (Tilted naturally for writing) -->
  <g filter="url(#penShadow)" transform="translate(650, 500) rotate(35)">
    <!-- Pen Tip (Nib) -->
    <polygon points="-28,150 28,150 0,224" fill="#fde68a" />
    <polygon points="-10,196 10,196 0,224" fill="#1e293b" />
    <!-- Pen Collar -->
    <rect x="-28" y="126" width="56" height="26" rx="4" fill="#fef3c7" />
    <!-- Pen Main Barrel -->
    <rect x="-28" y="-170" width="56" height="298" rx="12" fill="url(#penGrad)" />
    <!-- Pen Barrel Highlight -->
    <rect x="-18" y="-156" width="12" height="270" rx="6" fill="#fde68a" opacity="0.55" />
    <!-- Pen Cap Ring -->
    <rect x="-30" y="-120" width="60" height="14" rx="4" fill="#fef3c7" />
    <!-- Pen Top Cap Dome -->
    <path d="M -28 -170 C -28 -202 28 -202 28 -170 Z" fill="#1e293b" />
    <!-- Pen Pocket Clip -->
    <path d="M 28 -148 H 42 C 47 -148 50 -144 50 -138 V -36 C 50 -30 45 -26 40 -26 H 28" fill="none" stroke="#fef3c7" stroke-width="10" stroke-linecap="round" />
  </g>
</svg>
